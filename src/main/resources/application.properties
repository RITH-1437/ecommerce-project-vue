spring.application.name=backend

# ========================
# Server
# ========================
server.port=8080
debug=false

# ========================
# MySQL Database
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/apple_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Phnom_Penh&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=AppleStoreHikariCP
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-test-query=SELECT 1

# ========================
# Hibernate / JPA
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hibernate Dialect (MySQL 8)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Hibernate Performance Optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Connection Pool Optimization
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Hibernate Query Plan Cache
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Hibernate Statistics (disable in production)
spring.jpa.properties.hibernate.generate_statistics=false

# Hibernate Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# JSON Support for Hibernate Types (DISABLED - causes initialization issues)
# spring.jpa.properties.hibernate.type.json_format_mapper=com.vladmihalcea.hibernate.type.util.ObjectMapperJsonSerializer

# ========================
# Flyway
# ========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ========================
# JWT
# ========================
app.jwt.secret=${JWT_SECRET:myDefaultJwtSecretKeyThatIsAtLeast32CharactersLongForHS256}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=2592000000

# ========================
# Google OAuth2
# ========================
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# spring.security.oauth2.client.registration.google.scope=openid,profile,email
# spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ========================
# Swagger / OpenAPI
# ========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ========================
# Frontend
# ========================
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ========================
# ABA PayWay
# ========================
payway.merchantId=${PAYWAY_MERCHANT_ID:default_merchant_id}
payway.apiKey=${PAYWAY_API_KEY:default_api_key}
payway.secretKey=${PAYWAY_SECRET_KEY:default_secret_key}
payway.baseUrl=https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1
payway.callbackUrl=${PAYWAY_CALLBACK_URL:http://localhost:8080/api/payments/callback}
payway.returnUrl=${PAYWAY_RETURN_URL:http://localhost:3000/payment/success}
payway.paymentOption=abapay,cards,abapay_deeplink
payway.defaultCurrency=

# ========================
# OpenAI
# ========================
openai.api.key=${OPENAI_API_KEY:sk-placeholder-key-for-development}

# ========================
# Mail
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ========================
# Alerts
# ========================
alert.email.from=${ALERT_EMAIL_FROM:noreply@applestore.com}
alert.admin.email=${ALERT_ADMIN_EMAIL:admin@applestore.com}

# ========================
# Optional / Disabled
# ========================
ratelimit.enabled=false
management.health.redis.enabled=false
spring.data.redis.repositories.enabled=false
spring.data.redis.host=disabled

# ========================
# Logging
# ========================
logging.level.web=DEBUG
logging.level.org.springframework.boot.autoconfigure.ConditionEvaluationReportLogger=INFO
logging.level.org.springframework.boot.devtools.restart.Restarter=INFO
logging.level.org.springframework.boot.availability.ApplicationAvailabilityBean=INFO
