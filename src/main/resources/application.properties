spring.application.name=backend

# ========================
# Server
# ========================
server.port=8080
debug=false

# ========================
# MySQL Database
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/appl_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Phnom_Penh&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# Hibernate / JPA
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================
# Flyway
# ========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ========================
# JWT
# ========================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=2592000000

# ========================
# Google OAuth2
# ========================
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# spring.security.oauth2.client.registration.google.scope=openid,profile,email
# spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ========================
# Swagger / OpenAPI
# ========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ========================
# Frontend
# ========================
app.frontend.url=${FRONTEND_URL}

# ========================
# ABA PayWay
# ========================
payway.merchantId=${PAYWAY_MERCHANT_ID}
payway.apiKey=${PAYWAY_API_KEY}
payway.secretKey=${PAYWAY_SECRET_KEY}
payway.baseUrl=https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1
payway.callbackUrl=${PAYWAY_CALLBACK_URL}
payway.returnUrl=${PAYWAY_RETURN_URL}
payway.paymentOption=abapay,cards,abapay_deeplink
payway.defaultCurrency=

# ========================
# OpenAI
# ========================
# openai.api.key=${OPENAI_API_KEY}

# ========================
# Mail
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ========================
# Alerts
# ========================
alert.email.from=${ALERT_EMAIL_FROM}
alert.admin.email=${ALERT_ADMIN_EMAIL}

# ========================
# Optional / Disabled
# ========================
ratelimit.enabled=false
management.health.redis.enabled=false
spring.data.redis.repositories.enabled=false
spring.data.redis.host=disabled

# ========================
# Logging
# ========================
logging.level.org.springframework.boot.autoconfigure.ConditionEvaluationReportLogger=INFO
logging.level.org.springframework.boot.devtools.restart.Restarter=INFO
logging.level.org.springframework.boot.availability.ApplicationAvailabilityBean=INFO
