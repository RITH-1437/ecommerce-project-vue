spring.application.name=backend
# Fixed port for easier access to Swagger and API
server.port=8080
debug=false

# ========================
#  MySQL Database Config
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/appl_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Phnom_Penh&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Iloveyouforever@096}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
#  Hibernate / JPA Config
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Use MySQL8 dialect if running MySQL 8+, otherwise MySQLDialect is OK
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
#  Flyway Migration Config
# ========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET:ILOVEYOUFOREVER_1437_143_5201314_@_0966273314}
# 1 day (ms)
app.jwt.expiration-ms=86400000
# 30 days (ms)
app.jwt.refresh-expiration-ms=2592000000

# Google OAuth2 (replace with your real values)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}

# ========================
#  Swagger/OpenAPI Config
# ========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Frontend base url used for redirects
app.frontend.url=http://localhost:3000

# ========================
# ABA PayWay Configuration
# ========================
payway.merchantId=${PAYWAY_MERCHANT_ID:your-merchant-id}
payway.apiKey=${PAYWAY_API_KEY:your-api-key}
payway.secretKey=${PAYWAY_SECRET_KEY:your-secret-key}
# Confirm sandbox/prod endpoint with ABA docs ? this is an example
payway.baseUrl=https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1
payway.callbackUrl=http://localhost:1437/api/payments/aba/callback
payway.returnUrl=http://localhost:3000/payment-success
payway.paymentOption=abapay,cards,abapay_deeplink
payway.defaultCurrency=USD

# OpenAI API Key
# IMPORTANT: Set this in environment variables for production
